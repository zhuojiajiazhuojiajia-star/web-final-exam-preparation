{% extends "base.html" %}
{% block title %}背包{% endblock %}
{% block content %}
<div class="backpack-section">
    <div class="container">
        <div class="backpack-header">
            <h1><i class="fas fa-briefcase"></i> 我的背包</h1>
            <p>管理你拥有的所有物品</p>
            <div class="coin-display">
                <i class="fas fa-coins"></i>
                <span class="coin-amount">{{ currency.coins }}</span>
                <span class="coin-label">金币</span>
            </div>
        </div>

        <!-- 物品分类标签 -->
        <div class="backpack-tabs">
            <button class="backpack-tab active" data-category="all">
                <i class="fas fa-th-large"></i> 全部
            </button>
            <button class="backpack-tab" data-category="skin">
                <i class="fas fa-palette"></i> 皮肤
            </button>
            <button class="backpack-tab" data-category="badge">
                <i class="fas fa-award"></i> 徽章
            </button>
            <button class="backpack-tab" data-category="title">
                <i class="fas fa-tag"></i> 称号
            </button>
            <button class="backpack-tab" data-category="effect">
                <i class="fas fa-magic"></i> 特效
            </button>
        </div>

        <!-- 物品统计 -->
        <div class="backpack-stats">
            <div class="stat-item">
                <i class="fas fa-box"></i>
                <span id="totalItems">0</span> 件物品
            </div>
            <div class="stat-item">
                <i class="fas fa-check-circle"></i>
                <span id="equippedCount">0</span> 已装备
            </div>
        </div>

        <!-- 物品网格 -->
        <div class="backpack-grid" id="backpackGrid">
            <!-- 动态加载 -->
        </div>

        <!-- 空状态 -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <i class="fas fa-briefcase"></i>
            <h3>背包空空如也</h3>
            <p>这里还没有物品，去商城购买一些吧！</p>
            <a href="{{ url_for('shop.index') }}" class="btn btn-primary">
                <i class="fas fa-store"></i> 前往商城
            </a>
        </div>
    </div>
</div>

<!-- 物品详情弹窗 -->
<div class="modal" id="itemModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalItemName">物品名称</h2>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="modal-item-icon" id="modalItemIcon">🎁</div>
            <p class="modal-item-desc" id="modalItemDesc">物品描述</p>
            <div class="modal-item-info">
                <span class="modal-item-rarity" id="modalItemRarity">普通</span>
                <span class="modal-item-type" id="modalItemType">皮肤</span>
                <span class="modal-item-quantity" id="modalItemQuantity">x1</span>
            </div>
            <div class="modal-item-price">
                <i class="fas fa-coins"></i>
                <span id="modalItemPrice">0</span> 金币
            </div>
            <div class="modal-item-status" id="modalItemStatus"></div>
        </div>
        <div class="modal-footer" id="modalActions">
            <!-- 动态按钮 -->
        </div>
    </div>
</div>

<style>
.backpack-section {
    padding: 40px 20px;
    min-height: calc(100vh - 64px - 80px);
}

.backpack-header {
    text-align: center;
    margin-bottom: 40px;
}

.backpack-header h1 {
    font-size: 2.5rem;
    color: var(--gray-900);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.backpack-header h1 i {
    color: var(--primary);
}

.backpack-header p {
    color: var(--gray-600);
    margin-bottom: 20px;
}

.coin-display {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, #ffd700, #ffb347);
    color: #5a4a00;
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 1.2rem;
    font-weight: 600;
    box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
}

.backpack-tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.backpack-tab {
    padding: 10px 20px;
    border: 2px solid var(--gray-300);
    background: white;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: var(--transition);
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 6px;
}

.backpack-tab:hover {
    border-color: var(--primary);
    color: var(--primary);
}

.backpack-tab.active {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    border-color: transparent;
}

.backpack-stats {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-bottom: 30px;
}

.stat-item {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--gray-600);
    font-size: 1rem;
}

.stat-item i {
    color: var(--primary);
}

.backpack-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
}

.backpack-item {
    background: white;
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    box-shadow: var(--shadow);
    transition: var(--transition);
    border: 2px solid transparent;
    cursor: pointer;
    position: relative;
}

.backpack-item:hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow-xl);
}

.backpack-item.equipped {
    border-color: var(--success);
    background: linear-gradient(135deg, #f0fff4, #c6f6d5);
}

.backpack-item[data-rarity="rare"] {
    border-color: #4fc3f7;
}

.backpack-item[data-rarity="epic"] {
    border-color: #ba68c8;
}

.backpack-item[data-rarity="legendary"] {
    border-color: #ffd700;
    background: linear-gradient(135deg, #fffef0, #fff8e1);
}

.item-rarity {
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 500;
    text-transform: uppercase;
}

.rarity-common { background: var(--gray-200); color: var(--gray-700); }
.rarity-rare { background: #e1f5fe; color: #0277bd; }
.rarity-epic { background: #f3e5f5; color: #7b1fa2; }
.rarity-legendary { background: #fff8e1; color: #f57f17; }

.item-quantity {
    position: absolute;
    top: 10px;
    right: 10px;
    background: var(--gray-800);
    color: white;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.75rem;
    font-weight: 600;
}

.item-equipped-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    color: var(--success);
    font-size: 1rem;
}

.item-icon {
    font-size: 3.5rem;
    margin-bottom: 10px;
}

.item-name {
    font-size: 1rem;
    font-weight: 600;
    color: var(--gray-900);
    margin-bottom: 5px;
}

.item-type {
    font-size: 0.8rem;
    color: var(--gray-500);
}

.empty-state {
    text-align: center;
    padding: 60px 20px;
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 40px;
}

.empty-state i {
    font-size: 4rem;
    color: var(--gray-400);
    margin-bottom: 20px;
}

.empty-state h3 {
    font-size: 1.5rem;
    color: var(--gray-700);
    margin-bottom: 10px;
}

.empty-state p {
    color: var(--gray-500);
    margin-bottom: 20px;
}

/* 弹窗样式 */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
}

.modal.active {
    display: flex;
}

.modal-content {
    background: white;
    border-radius: var(--radius-lg);
    width: 90%;
    max-width: 400px;
    overflow: hidden;
    animation: modalSlide 0.3s ease;
}

@keyframes modalSlide {
    from { transform: translateY(-50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
}

.modal-header h2 {
    font-size: 1.3rem;
    margin: 0;
}

.modal-close {
    background: none;
    border: none;
    color: white;
    font-size: 1.5rem;
    cursor: pointer;
    padding: 0;
    line-height: 1;
}

.modal-body {
    padding: 30px 20px;
    text-align: center;
}

.modal-item-icon {
    font-size: 5rem;
    margin-bottom: 15px;
}

.modal-item-desc {
    color: var(--gray-600);
    margin-bottom: 15px;
}

.modal-item-info {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.modal-item-info span {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.85rem;
    background: var(--gray-100);
    color: var(--gray-700);
}

.modal-item-price {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #ffd700, #ffb347);
    color: #5a4a00;
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: 600;
    margin-bottom: 15px;
}

.modal-item-status {
    font-size: 0.9rem;
    color: var(--gray-500);
}

.modal-footer {
    padding: 20px;
    display: flex;
    gap: 10px;
    justify-content: center;
    border-top: 1px solid var(--gray-200);
}

.modal-footer .btn {
    flex: 1;
    justify-content: center;
}

.btn-danger {
    background: linear-gradient(135deg, var(--danger), #e53e3e);
    color: white;
    border-color: transparent;
}

.btn-danger:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(252, 129, 129, 0.4);
    color: white;
}

.btn-warning {
    background: linear-gradient(135deg, var(--warning), #ed8936);
    color: white;
    border-color: transparent;
}

.btn-warning:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(246, 173, 85, 0.4);
    color: white;
}

.btn-success {
    background: linear-gradient(135deg, var(--success), #38a169);
    color: white;
    border-color: transparent;
}

.btn-success:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(72, 187, 120, 0.4);
    color: white;
}
</style>

<script>
let currentCategory = 'all';
let currentItem = null;

document.addEventListener('DOMContentLoaded', function() {
    loadBackpackItems();
    
    document.querySelectorAll('.backpack-tab').forEach(tab => {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.backpack-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            currentCategory = this.dataset.category;
            loadBackpackItems();
        });
    });
});

function loadBackpackItems() {
    fetch(`/backpack/api/list?category=${currentCategory}`)
        .then(response => response.json())
        .then(data => {
            if (data.code === 200) {
                renderItems(data.items);
            }
        })
        .catch(error => {
            console.error('加载背包物品失败:', error);
        });
}

function renderItems(items) {
    const grid = document.getElementById('backpackGrid');
    const emptyState = document.getElementById('emptyState');
    
    document.getElementById('totalItems').textContent = items.length;
    document.getElementById('equippedCount').textContent = items.filter(i => i.is_equipped).length;
    
    if (items.length === 0) {
        grid.innerHTML = '';
        emptyState.style.display = 'block';
        return;
    }
    
    emptyState.style.display = 'none';
    
    grid.innerHTML = items.map(item => `
        <div class="backpack-item ${item.is_equipped ? 'equipped' : ''}" 
             data-rarity="${item.rarity}"
             data-item-id="${item.item_id}"
             onclick="showItemDetail(${item.item_id})">
            ${item.is_equipped ? '<span class="item-equipped-badge"><i class="fas fa-check-circle"></i></span>' : ''}
            <span class="item-quantity">x${item.quantity}</span>
            <div class="item-icon">${item.icon}</div>
            <h3 class="item-name">${item.name}</h3>
            <span class="item-type">${getCategoryName(item.item_category)}</span>
        </div>
    `).join('');
}

function getCategoryName(category) {
    const names = {
        'skin': '皮肤',
        'badge': '徽章',
        'title': '称号',
        'effect': '特效'
    };
    return names[category] || category;
}

function getRarityName(rarity) {
    const names = {
        'common': '普通',
        'rare': '稀有',
        'epic': '史诗',
        'legendary': '传说'
    };
    return names[rarity] || rarity;
}

function showItemDetail(itemId) {
    fetch(`/backpack/api/list?category=all`)
        .then(response => response.json())
        .then(data => {
            if (data.code === 200) {
                const item = data.items.find(i => i.item_id === itemId);
                if (item) {
                    currentItem = item;
                    openModal(item);
                }
            }
        });
}

function openModal(item) {
    document.getElementById('modalItemName').textContent = item.name;
    document.getElementById('modalItemIcon').textContent = item.icon;
    document.getElementById('modalItemDesc').textContent = item.description;
    document.getElementById('modalItemRarity').textContent = getRarityName(item.rarity);
    document.getElementById('modalItemRarity').className = `modal-item-rarity rarity-${item.rarity}`;
    document.getElementById('modalItemType').textContent = getCategoryName(item.item_category);
    document.getElementById('modalItemQuantity').textContent = `x${item.quantity}`;
    document.getElementById('modalItemPrice').textContent = Math.floor(item.price / 2);
    
    const statusEl = document.getElementById('modalItemStatus');
    if (item.is_equipped) {
        statusEl.innerHTML = '<span style="color: var(--success);"><i class="fas fa-check-circle"></i> 已装备</span>';
    } else {
        statusEl.innerHTML = '<span style="color: var(--gray-500);">未装备</span>';
    }
    
    const actionsEl = document.getElementById('modalActions');
    let buttons = '';
    
    if (item.item_type === 'boost' || item.item_type === 'effect') {
        buttons += `<button class="btn btn-warning" onclick="useItem()"><i class="fas fa-play"></i> 使用</button>`;
    }
    
    if (item.is_equipped) {
        buttons += `<button class="btn btn-outline" onclick="unequipItem()"><i class="fas fa-minus-circle"></i> 卸下</button>`;
    } else {
        buttons += `<button class="btn btn-success" onclick="equipItem()"><i class="fas fa-check"></i> 装备</button>`;
    }
    
    buttons += `<button class="btn btn-primary" onclick="sellItem()"><i class="fas fa-coins"></i> 出售</button>`;
    buttons += `<button class="btn btn-danger" onclick="discardItem()"><i class="fas fa-trash"></i> 丢弃</button>`;
    
    actionsEl.innerHTML = buttons;
    
    document.getElementById('itemModal').classList.add('active');
}

function closeModal() {
    document.getElementById('itemModal').classList.remove('active');
    currentItem = null;
}

function equipItem() {
    if (!currentItem) return;
    
    fetch('/backpack/api/equip', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item_id: currentItem.item_id })
    })
    .then(response => response.json())
    .then(data => {
        if (data.code === 200) {
            closeModal();
            loadBackpackItems();
            showFlash(data.msg, 'success');
        } else {
            showFlash(data.msg, 'error');
        }
    })
    .catch(error => {
        showFlash('操作失败，请重试', 'error');
    });
}

function unequipItem() {
    if (!currentItem) return;
    
    fetch('/backpack/api/unequip', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item_id: currentItem.item_id })
    })
    .then(response => response.json())
    .then(data => {
        if (data.code === 200) {
            closeModal();
            loadBackpackItems();
            showFlash(data.msg, 'success');
        } else {
            showFlash(data.msg, 'error');
        }
    })
    .catch(error => {
        showFlash('操作失败，请重试', 'error');
    });
}

function useItem() {
    if (!currentItem) return;
    
    if (currentItem.quantity <= 1) {
        if (!confirm('使用后物品将消失，确定要使用吗？')) {
            return;
        }
    }
    
    fetch('/backpack/api/use', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item_id: currentItem.item_id, use_count: 1 })
    })
    .then(response => response.json())
    .then(data => {
        if (data.code === 200) {
            closeModal();
            loadBackpackItems();
            showFlash(data.msg, 'success');
            updateCoins();
        } else {
            showFlash(data.msg, 'error');
        }
    })
    .catch(error => {
        showFlash('操作失败，请重试', 'error');
    });
}

function sellItem() {
    if (!currentItem) return;
    
    const sellPrice = Math.floor(currentItem.price / 2) * currentItem.quantity;
    if (!confirm(`确定要出售 ${currentItem.name} x${currentItem.quantity} 吗？\n可获得 ${sellPrice} 金币`)) {
        return;
    }
    
    fetch('/backpack/api/sell', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item_id: currentItem.item_id, sell_count: currentItem.quantity })
    })
    .then(response => response.json())
    .then(data => {
        if (data.code === 200) {
            closeModal();
            loadBackpackItems();
            showFlash(data.msg, 'success');
            updateCoins();
        } else {
            showFlash(data.msg, 'error');
        }
    })
    .catch(error => {
        showFlash('操作失败，请重试', 'error');
    });
}

function discardItem() {
    if (!currentItem) return;
    
    if (!confirm(`确定要丢弃 ${currentItem.name} x${currentItem.quantity} 吗？\n物品将无法恢复！`)) {
        return;
    }
    
    fetch('/backpack/api/discard', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item_id: currentItem.item_id, discard_count: currentItem.quantity })
    })
    .then(response => response.json())
    .then(data => {
        if (data.code === 200) {
            closeModal();
            loadBackpackItems();
            showFlash('丢弃成功', 'success');
        } else {
            showFlash(data.msg, 'error');
        }
    })
    .catch(error => {
        showFlash('操作失败，请重试', 'error');
    });
}

function updateCoins() {
    fetch('/shop/api/coins')
        .then(response => response.json())
        .then(data => {
            if (data.code === 200) {
                document.querySelector('.coin-amount').textContent = data.coins;
            }
        });
}

function showFlash(message, type) {
    const flashContainer = document.createElement('div');
    flashContainer.className = `flash flash-${type}`;
    flashContainer.innerHTML = `
        <span>${message}</span>
        <button onclick="this.parentElement.remove()" class="flash-close">&times;</button>
    `;
    
    const container = document.querySelector('.flash-container') || (() => {
        const div = document.createElement('div');
        div.className = 'flash-container';
        document.body.prepend(div);
        return div;
    })();
    
    container.appendChild(flashContainer);
    
    setTimeout(() => {
        flashContainer.remove();
    }, 3000);
}

document.getElementById('itemModal').addEventListener('click', function(e) {
    if (e.target === this) {
        closeModal();
    }
});
</script>
{% endblock %}
