{% extends "base.html" %}
{% block title %}皮肤商城{% endblock %}
{% block content %}
<div class="skin-section">
    <div class="container">
        <div class="skin-header">
            <h1><i class="fas fa-palette"></i> 皮肤商城</h1>
            <p>为你的游戏角色打造独特外观，展现个性风格！</p>
            {% if current_user.is_authenticated %}
            <div class="coin-display">
                <i class="fas fa-coins"></i>
                <span class="coin-amount">{{ user_coins }}</span>
                <span class="coin-label">金币</span>
            </div>
            {% endif %}
        </div>

        <!-- 游戏筛选 -->
        <div class="game-filter">
            <button class="filter-btn active" data-game="all">
                <i class="fas fa-globe"></i> 全部游戏
            </button>
            <button class="filter-btn" data-game="1">
                <i class="fas fa-worm"></i> 贪吃蛇
            </button>
            <button class="filter-btn" data-game="4">
                <i class="fas fa-cubes"></i> 俄罗斯方块
            </button>
            <button class="filter-btn" data-game="6">
                <i class="fas fa-table"></i> 打砖块
            </button>
        </div>

        <!-- 皮肤列表 -->
        <div class="skin-grid" id="skinGrid">
            <!-- 动态加载 -->
        </div>

        <div class="empty-text" id="emptyState" style="display: none;">
            <i class="fas fa-palette"></i>
            <p>暂无皮肤，敬请期待！</p>
        </div>

        <!-- 快捷链接 -->
        <div class="skin-links">
            <a href="{{ url_for('shop.index') }}" class="skin-link-card">
                <i class="fas fa-store"></i>
                <span>返回商城</span>
            </a>
            <a href="{{ url_for('shop.my_items') }}" class="skin-link-card">
                <i class="fas fa-backpack"></i>
                <span>我的物品</span>
            </a>
        </div>
    </div>
</div>

<!-- 皮肤详情弹窗 -->
<div class="modal" id="skinModal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <div class="modal-body" id="modalBody">
            <!-- 动态内容 -->
        </div>
    </div>
</div>

<style>
.skin-section {
    padding: 40px 20px;
    min-height: calc(100vh - 64px - 80px);
}

.skin-header {
    text-align: center;
    margin-bottom: 40px;
}

.skin-header h1 {
    font-size: 2.5rem;
    color: var(--gray-900);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.skin-header h1 i {
    color: #e91e63;
}

.skin-header p {
    color: var(--gray-600);
    margin-bottom: 20px;
}

.coin-display {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, #ffd700, #ffb347);
    color: #5a4a00;
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 1.2rem;
    font-weight: 600;
    box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
}

.coin-display i {
    font-size: 1.4rem;
}

.coin-amount {
    font-size: 1.5rem;
}

.game-filter {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 30px;
    flex-wrap: wrap;
}

.filter-btn {
    padding: 10px 20px;
    border: 2px solid var(--gray-300);
    background: white;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: var(--transition);
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 6px;
}

.filter-btn:hover {
    border-color: #e91e63;
    color: #e91e63;
}

.filter-btn.active {
    background: linear-gradient(135deg, #e91e63, #9c27b0);
    color: white;
    border-color: transparent;
}

.skin-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
}

.skin-card {
    background: white;
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    box-shadow: var(--shadow);
    transition: var(--transition);
    border: 2px solid transparent;
    cursor: pointer;
}

.skin-card:hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow-xl);
}

.skin-card[data-rarity="rare"] {
    border-color: #4fc3f7;
}

.skin-card[data-rarity="epic"] {
    border-color: #ba68c8;
}

.skin-card[data-rarity="legendary"] {
    border-color: #ffd700;
    background: linear-gradient(135deg, #fffef0, #fff8e1);
}

.skin-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.item-rarity {
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 500;
    text-transform: uppercase;
}

.rarity-common { background: var(--gray-200); color: var(--gray-700); }
.rarity-rare { background: #e1f5fe; color: #0277bd; }
.rarity-epic { background: #f3e5f5; color: #7b1fa2; }
.rarity-legendary { background: #fff8e1; color: #f57f17; }

.owned-badge {
    color: var(--success);
    font-size: 0.85rem;
    font-weight: 500;
}

.equipped-badge {
    color: var(--primary);
    font-size: 0.85rem;
    font-weight: 500;
}

.skin-preview {
    width: 100px;
    height: 100px;
    margin: 0 auto 15px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    position: relative;
}

.skin-preview.glow {
    animation: glow 2s ease-in-out infinite;
}

@keyframes glow {
    0%, 100% { box-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
    50% { box-shadow: 0 0 25px rgba(255, 255, 255, 0.8); }
}

.skin-name {
    font-size: 1.2rem;
    margin-bottom: 8px;
    color: var(--gray-900);
}

.skin-desc {
    color: var(--gray-600);
    font-size: 0.85rem;
    margin-bottom: 15px;
    min-height: 40px;
}

.skin-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 15px;
    border-top: 1px solid var(--gray-200);
}

.skin-price {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 1.2rem;
    font-weight: 700;
    color: #f57f17;
}

.skin-actions {
    display: flex;
    gap: 8px;
}

/* 弹窗样式 */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
}

.modal.show {
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-content {
    background: white;
    border-radius: var(--radius);
    padding: 30px;
    max-width: 500px;
    width: 90%;
    position: relative;
    animation: modalSlide 0.3s ease;
}

@keyframes modalSlide {
    from {
        transform: translateY(-20px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.modal-close {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 1.5rem;
    cursor: pointer;
    color: var(--gray-500);
}

.modal-close:hover {
    color: var(--gray-800);
}

.modal-skin-preview {
    width: 120px;
    height: 120px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
}

.modal-skin-name {
    text-align: center;
    font-size: 1.5rem;
    margin-bottom: 10px;
}

.modal-skin-desc {
    text-align: center;
    color: var(--gray-600);
    margin-bottom: 20px;
}

.skin-config-preview {
    background: var(--gray-100);
    border-radius: var(--radius-sm);
    padding: 15px;
    margin-bottom: 20px;
}

.skin-config-item {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid var(--gray-200);
}

.skin-config-item:last-child {
    border-bottom: none;
}

.skin-config-label {
    color: var(--gray-600);
    font-size: 0.9rem;
}

.skin-config-value {
    font-weight: 600;
    font-family: monospace;
}

.color-swatch {
    display: inline-block;
    width: 20px;
    height: 20px;
    border-radius: 4px;
    vertical-align: middle;
    margin-right: 5px;
    border: 1px solid var(--gray-300);
}

.skin-links {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    max-width: 400px;
    margin: 0 auto;
}

.skin-link-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 20px;
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: var(--transition);
    color: var(--gray-700);
}

.skin-link-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-lg);
    color: var(--primary);
}

.skin-link-card i {
    font-size: 2rem;
    color: var(--primary);
}

.empty-text {
    text-align: center;
    padding: 60px 20px;
    color: var(--gray-500);
}

.empty-text i {
    font-size: 4rem;
    margin-bottom: 20px;
    opacity: 0.5;
}
</style>

<script>
let allSkins = [];
let userCoins = {{ user_coins or 0 }};

// 页面加载时获取皮肤数据
document.addEventListener('DOMContentLoaded', function() {
    loadSkins();
    initFilters();
});

function loadSkins() {
    fetch('/shop/api/skins')
        .then(response => response.json())
        .then(data => {
            if (data.code === 200) {
                allSkins = data.skins;
                renderSkins(allSkins);
            }
        })
        .catch(error => {
            console.error('加载皮肤失败:', error);
        });
}

function renderSkins(skins) {
    const grid = document.getElementById('skinGrid');
    const emptyState = document.getElementById('emptyState');
    
    if (skins.length === 0) {
        grid.innerHTML = '';
        emptyState.style.display = 'block';
        return;
    }
    
    emptyState.style.display = 'none';
    
    grid.innerHTML = skins.map(skin => {
        const rarityClass = `rarity-${skin.rarity}`;
        const previewStyle = skin.skin_config && skin.skin_config.block_color 
            ? `background-color: ${skin.skin_config.block_color}20; border: 3px solid ${skin.skin_config.block_color};` 
            : '';
        const glowClass = skin.skin_config && skin.skin_config.effect === 'glow' ? 'glow' : '';
        
        return `
            <div class="skin-card" data-rarity="${skin.rarity}" data-game="${skin.game_id || 'all'}" onclick="showSkinDetail(${skin.id})">
                <div class="skin-card-header">
                    <span class="item-rarity ${rarityClass}">${skin.rarity}</span>
                    ${skin.is_owned ? (skin.is_equipped ? '<span class="equipped-badge"><i class="fas fa-check-circle"></i> 已装备</span>' : '<span class="owned-badge"><i class="fas fa-check"></i> 已拥有</span>') : ''}
                </div>
                <div class="skin-preview ${glowClass}" style="${previewStyle}">
                    ${skin.icon}
                </div>
                <h3 class="skin-name">${skin.name}</h3>
                <p class="skin-desc">${skin.description || '暂无描述'}</p>
                <div class="skin-footer">
                    <div class="skin-price">
                        <i class="fas fa-coins"></i>
                        <span>${skin.price}</span>
                    </div>
                    <div class="skin-actions">
                        ${skin.is_owned 
                            ? `<button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); previewSkin(${skin.id})">预览</button>`
                            : `<button class="btn btn-primary btn-sm" onclick="event.stopPropagation(); buySkin(${skin.id}, '${skin.name}', ${skin.price})">购买</button>`
                        }
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

function initFilters() {
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            
            const gameId = this.dataset.game;
            if (gameId === 'all') {
                renderSkins(allSkins);
            } else {
                const filtered = allSkins.filter(s => s.game_id == gameId);
                renderSkins(filtered);
            }
        });
    });
}

function showSkinDetail(skinId) {
    const skin = allSkins.find(s => s.id === skinId);
    if (!skin) return;
    
    const modal = document.getElementById('skinModal');
    const modalBody = document.getElementById('modalBody');
    
    const previewStyle = skin.skin_config && skin.skin_config.block_color 
        ? `background-color: ${skin.skin_config.block_color}20; border: 4px solid ${skin.skin_config.block_color};` 
        : '';
    const glowClass = skin.skin_config && skin.skin_config.effect === 'glow' ? 'glow' : '';
    
    let configHtml = '';
    if (skin.skin_config) {
        const cfg = skin.skin_config;
        if (cfg.block_color) {
            configHtml += `<div class="skin-config-item">
                <span class="skin-config-label">主色调</span>
                <span class="skin-config-value">
                    <span class="color-swatch" style="background-color: ${cfg.block_color}"></span>
                    ${cfg.block_color}
                </span>
            </div>`;
        }
        if (cfg.pattern) {
            configHtml += `<div class="skin-config-item">
                <span class="skin-config-label">图案风格</span>
                <span class="skin-config-value">${cfg.pattern}</span>
            </div>`;
        }
        if (cfg.effect) {
            configHtml += `<div class="skin-config-item">
                <span class="skin-config-label">特殊效果</span>
                <span class="skin-config-value">${cfg.effect}</span>
            </div>`;
        }
        if (cfg.game_name) {
            configHtml += `<div class="skin-config-item">
                <span class="skin-config-label">适用游戏</span>
                <span class="skin-config-value">${cfg.game_name}</span>
            </div>`;
        }
    }
    
    modalBody.innerHTML = `
        <div class="modal-skin-preview ${glowClass}" style="${previewStyle}">
            ${skin.icon}
        </div>
        <h2 class="modal-skin-name">${skin.name}</h2>
        <p class="modal-skin-desc">${skin.description || '暂无描述'}</p>
        
        ${configHtml ? `<div class="skin-config-preview">${configHtml}</div>` : ''}
        
        <div style="text-align: center; margin-bottom: 20px;">
            <span class="item-rarity rarity-${skin.rarity}">${skin.rarity}</span>
        </div>
        
        <div style="display: flex; gap: 10px; justify-content: center;">
            ${skin.is_owned 
                ? `<button class="btn btn-primary" onclick="previewSkin(${skin.id}); closeModal();">
                    <i class="fas fa-eye"></i> 试穿预览
                   </button>
                   ${skin.is_equipped 
                       ? `<button class="btn btn-outline" onclick="unequipSkin(${skin.id}); closeModal();">
                            <i class="fas fa-times"></i> 卸下
                          </button>`
                       : `<button class="btn btn-outline" onclick="equipSkin(${skin.id}); closeModal();">
                            <i class="fas fa-check"></i> 装备
                          </button>`
                   }`
                : `<button class="btn btn-primary" onclick="buySkin(${skin.id}, '${skin.name}', ${skin.price}); closeModal();">
                    <i class="fas fa-coins"></i> ${skin.price} 金币购买
                   </button>`
            }
        </div>
    `;
    
    modal.classList.add('show');
}

function closeModal() {
    document.getElementById('skinModal').classList.remove('show');
}

function buySkin(skinId, name, price) {
    {% if not current_user.is_authenticated %}
    window.location.href = '{{ url_for('auth.login') }}';
    return;
    {% endif %}
    
    if (!confirm(`确定花费 ${price} 金币购买 "${name}" 吗？`)) {
        return;
    }
    
    fetch(`/shop/buy/${skinId}`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.code === 200) {
            alert('购买成功！');
            loadSkins();
        } else {
            alert(data.msg);
        }
    })
    .catch(error => {
        alert('购买失败，请重试');
    });
}

function previewSkin(skinId) {
    fetch('/shop/api/preview', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ skin_id: skinId })
    })
    .then(response => response.json())
    .then(data => {
        if (data.code === 200) {
            alert(`预览皮肤: ${data.preview.name}\n配置: ${JSON.stringify(data.preview.skin_config, null, 2)}`);
        } else {
            alert(data.msg);
        }
    })
    .catch(error => {
        alert('预览失败，请重试');
    });
}

function equipSkin(skinId) {
    fetch(`/shop/equip/${skinId}`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.code === 200) {
            alert('装备成功！');
            loadSkins();
        } else {
            alert(data.msg);
        }
    })
    .catch(error => {
        alert('装备失败，请重试');
    });
}

function unequipSkin(skinId) {
    fetch(`/shop/equip/${skinId}`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.code === 200) {
            alert('已卸下！');
            loadSkins();
        } else {
            alert(data.msg);
        }
    })
    .catch(error => {
        alert('操作失败，请重试');
    });
}

// 点击弹窗外部关闭
document.getElementById('skinModal').addEventListener('click', function(e) {
    if (e.target === this) {
        closeModal();
    }
});
</script>
{% endblock %}
