{% extends "game/game_base.html" %}
{% block title %}2048{% endblock %}
{% block game_content %}
<div id="game2048" style="width:400px;height:400px;position:relative;">
    <div id="grid2048" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;background:#bbada0;border-radius:8px;width:100%;height:100%;"></div>
    <div id="tiles2048" style="position:absolute;top:8px;left:8px;right:8px;bottom:8px;"></div>
</div>
{% endblock %}
{% block game_js %}
<script>
const SIZE = 4;
const CELL = 88; // 修复：(400 - 5*8) / 4 = 88，确保 4列总宽 = 4*88 + 3*8 = 376，加上padding正好
const GAP = 8;
let grid, score, gameOver, won;

const TILE_COLORS = {
    0: 'rgba(238,228,218,0.35)', 2: '#eee4da', 4: '#ede0c8',
    8: '#f2b179', 16: '#f59563', 32: '#f67c5f', 64: '#f65e3b',
    128: '#edcf72', 256: '#edcc61', 512: '#edc850', 1024: '#edc53f', 2048: '#edc22e'
};
const TEXT_COLORS = { 2: '#776e65', 4: '#776e65' };

function init2048() {
    grid = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
    score = 0;
    gameOver = false;
    won = false;
    addTile();
    addTile();
    render();
    updateScore(0);
}

function addTile() {
    const empty = [];
    for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
            if (grid[r][c] === 0) empty.push({r, c});
    if (empty.length === 0) return;
    const {r, c} = empty[Math.floor(Math.random() * empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function render() {
    const gridEl = document.getElementById('grid2048');
    const tilesEl = document.getElementById('tiles2048');
    
    gridEl.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            const cell = document.createElement('div');
            cell.style.cssText = `background:rgba(238,228,218,0.35);border-radius:6px;`;
            gridEl.appendChild(cell);
        }
    }
    
    tilesEl.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] === 0) continue;
            const val = grid[r][c];
            const tile = document.createElement('div');
            const bgColor = TILE_COLORS[val] || '#3c3a32';
            const textColor = TEXT_COLORS[val] || '#f9f6f2';
            const fontSize = val >= 1024 ? '24px' : val >= 128 ? '28px' : '36px';
            // 修复定位：使用 CELL + GAP = 96
            tile.style.cssText = `
                position:absolute;
                top:${r * (CELL + GAP)}px; left:${c * (CELL + GAP)}px;
                width:${CELL}px; height:${CELL}px;
                background:${bgColor}; color:${textColor};
                border-radius:6px; display:flex; align-items:center; justify-content:center;
                font-size:${fontSize}; font-weight:700;
                transition: all 0.15s ease;
            `;
            tile.textContent = val;
            tilesEl.appendChild(tile);
        }
    }
}

function slide(row) {
    let arr = row.filter(v => v !== 0);
    let merged = [];
    let sc = 0;
    for (let i = 0; i < arr.length; i++) {
        if (i + 1 < arr.length && arr[i] === arr[i+1]) {
            merged.push(arr[i] * 2);
            sc += arr[i] * 2;
            i++;
        } else {
            merged.push(arr[i]);
        }
    }
    while (merged.length < SIZE) merged.push(0);
    return {row: merged, score: sc};
}

function move(direction) {
    if (gameOver) return;
    
    let moved = false;
    let totalScore = 0;
    const oldGrid = grid.map(r => [...r]);
    
    if (direction === 'left') {
        for (let r = 0; r < SIZE; r++) {
            const result = slide(grid[r]);
            grid[r] = result.row;
            totalScore += result.score;
        }
    } else if (direction === 'right') {
        for (let r = 0; r < SIZE; r++) {
            const result = slide([...grid[r]].reverse());
            grid[r] = result.row.reverse();
            totalScore += result.score;
        }
    } else if (direction === 'up') {
        for (let c = 0; c < SIZE; c++) {
            const col = grid.map(r => r[c]);
            const result = slide(col);
            for (let r = 0; r < SIZE; r++) grid[r][c] = result.row[r];
            totalScore += result.score;
        }
    } else if (direction === 'down') {
        for (let c = 0; c < SIZE; c++) {
            const col = grid.map(r => r[c]).reverse();
            const result = slide(col);
            const newCol = result.row.reverse();
            for (let r = 0; r < SIZE; r++) grid[r][c] = newCol[r];
            totalScore += result.score;
        }
    }
    
    for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
            if (grid[r][c] !== oldGrid[r][c]) moved = true;
    
    if (moved) {
        score += totalScore;
        updateScore(score);
        addTile();
        render();
        
        for (let r = 0; r < SIZE; r++)
            for (let c = 0; c < SIZE; c++)
                if (grid[r][c] === 2048 && !won) {
                    won = true;
                    stopTimer();
                    setTimeout(() => {
                        alert('🎉 恭喜！你达到了2048！');
                        // 可以继续玩，但不计分了
                    }, 300);
                }
        
        if (isGameOver()) {
            gameOver = true;
            stopTimer();
            showGameOver(score);
        }
    }
}

function isGameOver() {
    for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] === 0) return false;
            if (c + 1 < SIZE && grid[r][c] === grid[r][c+1]) return false;
            if (r + 1 < SIZE && grid[r][c] === grid[r+1][c]) return false;
        }
    return true;
}

document.addEventListener('keydown', e => {
    const map = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
                 w:'up', s:'down', a:'left', d:'right'};
    if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
});

let touchStartX, touchStartY;
document.getElementById('game2048').addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
});
document.getElementById('game2048').addEventListener('touchend', e => {
    if (!touchStartX || !touchStartY) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const absDx = Math.abs(dx), absDy = Math.abs(dy);
    // 修复：阈值从 30 提高到 50
    if (Math.max(absDx, absDy) < 50) return;
    if (absDx > absDy) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
    touchStartX = touchStartY = null;
});

function startGame() {
    init2048();
    startTimer();
    gameRunning = true;
}

function pauseGame() { /* 2048 是回合制，无需暂停 */ }

function resetGame() {
    stopTimer();
    gameSeconds = 0;
    document.getElementById('gameTimer').textContent = '0:00';
    init2048();
    gameRunning = false;
}

init2048();
</script>
{% endblock %}
