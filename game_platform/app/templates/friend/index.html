{% extends "base.html" %}
{% block title %}好友中心{% endblock %}
{% block content %}
<section class="friend-section">
    <div class="container">
        <h1 class="section-title"><i class="fas fa-users"></i> 好友中心</h1>
        
        <div class="friend-layout">
            <!-- 左侧：搜索用户 -->
            <div class="friend-sidebar">
                <!-- 搜索用户 -->
                <div class="friend-card">
                    <h3><i class="fas fa-search"></i> 搜索用户</h3>
                    <div class="search-box">
                        <input type="text" id="searchKeyword" placeholder="输入用户名或昵称..." onkeyup="handleSearch(event)">
                        <button onclick="searchUsers()" class="btn btn-primary btn-sm"><i class="fas fa-search"></i></button>
                    </div>
                    <div id="searchResults" class="user-list"></div>
                </div>
            </div>

            <!-- 中间：好友列表 -->
            <div class="friend-main">
                <!-- 标签页 -->
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('friends')">
                        <i class="fas fa-user-friends"></i> 我的好友
                    </button>
                    <button class="tab-btn" onclick="switchTab('requests')">
                        <i class="fas fa-user-plus"></i> 好友请求 
                        <span id="requestBadge" class="badge" style="display:none;">0</span>
                    </button>
                </div>

                <!-- 好友列表 -->
                <div id="friendsTab" class="tab-content active">
                    <div id="friendsList" class="friends-grid"></div>
                    <div id="emptyFriends" class="empty-state" style="display:none;">
                        <i class="fas fa-user-friends"></i>
                        <p>还没有好友，搜索用户添加好友吧！</p>
                    </div>
                </div>

                <!-- 好友请求 -->
                <div id="requestsTab" class="tab-content" style="display:none;">
                    <div id="requestsList" class="requests-list"></div>
                    <div id="emptyRequests" class="empty-state" style="display:none;">
                        <i class="fas fa-inbox"></i>
                        <p>暂无好友请求</p>
                    </div>
                </div>
            </div>

            <!-- 右侧：好友排行榜 -->
            <div class="friend-sidebar">
                <div class="friend-card">
                    <h3><i class="fas fa-trophy"></i> 好友排行榜</h3>
                    <div id="friendLeaderboard" class="leaderboard-list"></div>
                    <div id="emptyLeaderboard" class="empty-state" style="display:none;">
                        <p>暂无排行数据</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- 消息提示 -->
<div id="toast" class="toast" style="display:none;"></div>

<style>
.friend-section {
    padding: 30px 0;
}

.friend-layout {
    display: grid;
    grid-template-columns: 280px 1fr 280px;
    gap: 20px;
    margin-top: 20px;
}

.friend-card {
    background: white;
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow-sm);
}

.friend-card h3 {
    margin-bottom: 15px;
    font-size: 1.1rem;
    color: var(--gray-800);
    display: flex;
    align-items: center;
    gap: 8px;
}

.friend-card h3 i {
    color: var(--primary);
}

/* 搜索 */
.search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

.search-box input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--gray-300);
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
}

.search-box input:focus {
    outline: none;
    border-color: var(--primary);
}

.user-list {
    max-height: 400px;
    overflow-y: auto;
}

.user-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    background: var(--gray-100);
}

.user-item:hover {
    background: var(--gray-200);
}

.user-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--gray-300);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    color: var(--gray-600);
}

.user-info {
    flex: 1;
}

.user-name {
    font-weight: 500;
    color: var(--gray-800);
}

.user-score {
    font-size: 0.8rem;
    color: var(--gray-500);
}

.user-actions {
    display: flex;
    gap: 5px;
}

/* 标签页 */
.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.tab-btn {
    padding: 10px 20px;
    border: none;
    background: var(--gray-200);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.95rem;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 8px;
}

.tab-btn:hover {
    background: var(--gray-300);
}

.tab-btn.active {
    background: var(--primary);
    color: white;
}

.badge {
    background: var(--danger);
    color: white;
    font-size: 0.75rem;
    padding: 2px 6px;
    border-radius: 10px;
}

/* 好友网格 */
.friends-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 15px;
}

.friend-card-item {
    background: white;
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
}

.friend-card-item:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
}

.friend-card-avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    color: white;
}

.friend-card-name {
    font-weight: 600;
    color: var(--gray-800);
    margin-bottom: 5px;
}

.friend-card-score {
    font-size: 0.85rem;
    color: var(--gray-500);
    margin-bottom: 12px;
}

.friend-card-score span {
    color: var(--primary);
    font-weight: 600;
}

/* 请求列表 */
.requests-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.request-item {
    display: flex;
    align-items: center;
    gap: 15px;
    background: white;
    padding: 15px;
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
}

.request-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    color: white;
}

.request-info {
    flex: 1;
}

.request-name {
    font-weight: 600;
    color: var(--gray-800);
}

.request-time {
    font-size: 0.8rem;
    color: var(--gray-500);
}

.request-actions {
    display: flex;
    gap: 8px;
}

/* 排行榜 */
.leaderboard-list {
    max-height: 450px;
    overflow-y: auto;
}

.leaderboard-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    background: var(--gray-100);
}

.leaderboard-item:hover {
    background: var(--gray-200);
}

.leaderboard-rank {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.85rem;
}

.leaderboard-rank.gold {
    background: linear-gradient(135deg, #ffd700, #ffb347);
    color: #5a4a00;
}

.leaderboard-rank.silver {
    background: linear-gradient(135deg, #c0c0c0, #a0a0a0);
    color: #505050;
}

.leaderboard-rank.bronze {
    background: linear-gradient(135deg, #cd7f32, #b8690a);
    color: white;
}

.leaderboard-rank.default {
    background: var(--gray-300);
    color: var(--gray-600);
}

.leaderboard-info {
    flex: 1;
}

.leaderboard-name {
    font-weight: 500;
    color: var(--gray-800);
}

.leaderboard-score {
    font-size: 0.8rem;
    color: var(--primary);
}

/* 空状态 */
.empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--gray-500);
}

.empty-state i {
    font-size: 3rem;
    margin-bottom: 15px;
    opacity: 0.5;
}

.empty-state p {
    margin: 0;
}

/* 按钮 */
.btn-sm {
    padding: 6px 12px;
    font-size: 0.85rem;
}

.btn-success {
    background: var(--success);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: var(--transition);
}

.btn-success:hover {
    background: #27ae60;
}

.btn-danger {
    background: var(--danger);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: var(--transition);
}

.btn-danger:hover {
    background: #c0392b;
}

/* Toast */
.toast {
    position: fixed;
    top: 80px;
    right: 20px;
    padding: 12px 24px;
    border-radius: var(--radius-sm);
    color: white;
    font-size: 0.9rem;
    z-index: 1000;
    animation: slideIn 0.3s ease;
}

.toast.success {
    background: var(--success);
}

.toast.error {
    background: var(--danger);
}

@keyframes slideIn {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

@media (max-width: 1024px) {
    .friend-layout {
        grid-template-columns: 1fr;
    }
    
    .friend-sidebar {
        order: 1;
    }
    
    .friend-main {
        order: 0;
    }
}
</style>

{% endblock %}

{% block extra_js %}
<script>
let currentTab = 'friends';

document.addEventListener('DOMContentLoaded', function() {
    loadFriends();
    loadRequests();
    loadLeaderboard();
});

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
    
    if (tab === 'friends') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('friendsTab').style.display = 'block';
    } else {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('requestsTab').style.display = 'block';
    }
}

function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = `toast ${type}`;
    toast.style.display = 'block';
    setTimeout(() => {
        toast.style.display = 'none';
    }, 3000);
}

function getAvatarHtml(nickname, size = '') {
    const initial = (nickname && nickname[0]) ? nickname[0].toUpperCase() : 'U';
    const sizeClass = size === 'small' ? ' style="width:40px;height:40px;font-size:1.2rem;"' : '';
    return `<div class="user-avatar"${sizeClass}><i class="fas fa-user"></i></div>`;
}

async function loadFriends() {
    try {
        const res = await fetch('/friend/api/list');
        const data = await res.json();
        const container = document.getElementById('friendsList');
        const empty = document.getElementById('emptyFriends');
        
        if (data.success && data.friends.length > 0) {
            container.innerHTML = data.friends.map(f => `
                <div class="friend-card-item">
                    <div class="friend-card-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="friend-card-name">${f.nickname || f.username}</div>
                    <div class="friend-card-score">积分: <span>${f.total_score}</span></div>
                    <button onclick="deleteFriend(${f.friend_id})" class="btn btn-danger btn-sm">
                        <i class="fas fa-trash"></i> 删除
                    </button>
                </div>
            `).join('');
            empty.style.display = 'none';
        } else {
            container.innerHTML = '';
            empty.style.display = 'block';
        }
    } catch (e) {
        console.error('加载好友失败:', e);
    }
}

async function loadRequests() {
    try {
        const res = await fetch('/friend/api/requests');
        const data = await res.json();
        const container = document.getElementById('requestsList');
        const empty = document.getElementById('emptyRequests');
        const badge = document.getElementById('requestBadge');
        
        if (data.success && data.requests.length > 0) {
            container.innerHTML = data.requests.map(r => `
                <div class="request-item">
                    <div class="request-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="request-info">
                        <div class="request-name">${r.nickname || r.username}</div>
                        <div class="request-time">${formatTime(r.created_at)}</div>
                    </div>
                    <div class="request-actions">
                        <button onclick="acceptRequest(${r.id})" class="btn btn-success btn-sm">
                            <i class="fas fa-check"></i> 接受
                        </button>
                        <button onclick="rejectRequest(${r.id})" class="btn btn-danger btn-sm">
                            <i class="fas fa-times"></i> 拒绝
                        </button>
                    </div>
                </div>
            `).join('');
            empty.style.display = 'none';
            badge.textContent = data.requests.length;
            badge.style.display = 'inline';
        } else {
            container.innerHTML = '';
            empty.style.display = 'block';
            badge.style.display = 'none';
        }
    } catch (e) {
        console.error('加载请求失败:', e);
    }
}

async function loadLeaderboard() {
    try {
        const res = await fetch('/friend/api/friend-scores');
        const data = await res.json();
        const container = document.getElementById('friendLeaderboard');
        const empty = document.getElementById('emptyLeaderboard');
        
        if (data.success && data.rankings.length > 0) {
            container.innerHTML = data.rankings.map(r => {
                let rankClass = 'default';
                if (r.rank === 1) rankClass = 'gold';
                else if (r.rank === 2) rankClass = 'silver';
                else if (r.rank === 3) rankClass = 'bronze';
                
                return `
                    <div class="leaderboard-item">
                        <div class="leaderboard-rank ${rankClass}">${r.rank}</div>
                        <div class="leaderboard-info">
                            <div class="leaderboard-name">${r.nickname || r.username}</div>
                            <div class="leaderboard-score">${r.total_score} 积分</div>
                        </div>
                    </div>
                `;
            }).join('');
            empty.style.display = 'none';
        } else {
            container.innerHTML = '';
            empty.style.display = 'block';
        }
    } catch (e) {
        console.error('加载排行榜失败:', e);
    }
}

function handleSearch(event) {
    if (event.key === 'Enter') {
        searchUsers();
    }
}

async function searchUsers() {
    const keyword = document.getElementById('searchKeyword').value.trim();
    const container = document.getElementById('searchResults');
    
    if (!keyword) {
        container.innerHTML = '';
        return;
    }
    
    try {
        const res = await fetch(`/friend/api/search?keyword=${encodeURIComponent(keyword)}`);
        const data = await res.json();
        
        if (data.success && data.users.length > 0) {
            container.innerHTML = data.users.map(u => {
                let actionBtn = '';
                if (u.friend_status === 'none') {
                    actionBtn = `<button onclick="sendRequest(${u.id})" class="btn btn-primary btn-sm"><i class="fas fa-user-plus"></i> 添加</button>`;
                } else if (u.friend_status === 'friends') {
                    actionBtn = `<span style="color:var(--success);font-size:0.85rem;"><i class="fas fa-check"></i> 已是好有</span>`;
                } else if (u.friend_status === 'pending_sent') {
                    actionBtn = `<span style="color:var(--gray-500);font-size:0.85rem;"><i class="fas fa-clock"></i> 已发送</span>`;
                } else if (u.friend_status === 'pending_received') {
                    actionBtn = `<span style="color:var(--warning);font-size:0.85rem;"><i class="fas fa-clock"></i> 待处理</span>`;
                }
                
                return `
                    <div class="user-item">
                        ${getAvatarHtml(u.nickname, 'small')}
                        <div class="user-info">
                            <div class="user-name">${u.nickname || u.username}</div>
                            <div class="user-score">积分: ${u.total_score}</div>
                        </div>
                        <div class="user-actions">${actionBtn}</div>
                    </div>
                `;
            }).join('');
        } else {
            container.innerHTML = '<p style="text-align:center;color:var(--gray-500);padding:20px;">未找到用户</p>';
        }
    } catch (e) {
        console.error('搜索失败:', e);
        showToast('搜索失败', 'error');
    }
}

async function sendRequest(friendId) {
    try {
        const res = await fetch('/friend/api/send', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({friend_id: friendId})
        });
        const data = await res.json();
        showToast(data.message, data.success ? 'success' : 'error');
        if (data.success) {
            searchUsers();
            loadRequests();
        }
    } catch (e) {
        showToast('发送请求失败', 'error');
    }
}

async function acceptRequest(requestId) {
    try {
        const res = await fetch('/friend/api/accept', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({request_id: requestId})
        });
        const data = await res.json();
        showToast(data.message, data.success ? 'success' : 'error');
        if (data.success) {
            loadRequests();
            loadFriends();
            loadLeaderboard();
        }
    } catch (e) {
        showToast('操作失败', 'error');
    }
}

async function rejectRequest(requestId) {
    try {
        const res = await fetch('/friend/api/reject', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({request_id: requestId})
        });
        const data = await res.json();
        showToast(data.message, data.success ? 'success' : 'error');
        if (data.success) {
            loadRequests();
        }
    } catch (e) {
        showToast('操作失败', 'error');
    }
}

async function deleteFriend(friendId) {
    if (!confirm('确定要删除该好友吗？')) return;
    
    try {
        const res = await fetch('/friend/api/delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({friend_id: friendId})
        });
        const data = await res.json();
        showToast(data.message, data.success ? 'success' : 'error');
        if (data.success) {
            loadFriends();
            loadLeaderboard();
        }
    } catch (e) {
        showToast('删除失败', 'error');
    }
}

function formatTime(isoString) {
    if (!isoString) return '';
    const date = new Date(isoString);
    const now = new Date();
    const diff = now - date;
    const minutes = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);
    const days = Math.floor(diff / 86400000);
    
    if (minutes < 1) return '刚刚';
    if (minutes < 60) return `${minutes}分钟前`;
    if (hours < 24) return `${hours}小时前`;
    if (days < 7) return `${days}天前`;
    return date.toLocaleDateString('zh-CN');
}
</script>
{% endblock %}
