{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="auth-header">
            <h2><i class="fas fa-sign-in-alt"></i> 登录</h2>
            <p>欢迎回来！请登录您的账号</p>
        </div>
        <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> 用户名</label>
                <input type="text" id="username" name="username" required placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> 密码</label>
                <input type="password" id="password" name="password" required placeholder="请输入密码" autocomplete="current-password">
            </div>
            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember"> 记住我
                </label>
            </div>
            <button type="submit" class="btn btn-primary btn-block">登 录</button>
            <div class="auth-footer">
                <p>还没有账号？<a href="{{ url_for('auth.register') }}">立即注册</a></p>
            </div>
        </form>
    </div>
</section>
{% endblock %}
{% block extra_js %}
<script>
async function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const remember = document.querySelector('input[name="remember"]').checked;

    try {
        const res = await fetch('{{ url_for("auth.login") }}', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password, remember})
        });
        const data = await res.json();
        if (data.code === 200) {
            window.location.href = '{{ url_for("main.index") }}';
        } else {
            alert(data.msg);
        }
    } catch(err) {
        alert('网络错误，请重试');
    }
}
</script>
{% endblock %}
